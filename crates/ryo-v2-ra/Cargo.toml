[package]
name = "ryo-v2-ra"
description = "rust-analyzer adapter of ryo-v2: in-memory code state, forks and HIR diagnostics over the ra_ap_* crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# D11: nothing that depends on the patched salsa (the fork Engine) is published in this phase.
publish = false
keywords = ["rust-analyzer", "refactoring", "diagnostics", "hir"]
categories = ["development-tools"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[features]
# The fork Engine's walk counters on `LayerStats` (salsa's `fork-probe`), for measurements only.
fork-probe = ["ryo-v2-engine/fork-probe"]

[dependencies]
ryo-v2-core.workspace = true
# Every fork of a session is layers of a frozen base (D11).
ryo-v2-engine.workspace = true
ra_ap_ide.workspace = true
ra_ap_hir.workspace = true
ra_ap_base_db.workspace = true
ra_ap_vfs.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_project_model.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_syntax.workspace = true
triomphe.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
