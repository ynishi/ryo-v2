[package]
name = "ryo-v2-engine"
description = "The fork Engine of ryo-v2: layers of writes over one frozen analysed salsa database, several live at once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# D11: nothing that depends on the patched salsa is published in this phase.
publish = false

[lints]
workspace = true

[features]
# The walk counters of salsa's fork layer on `LayerStats` (doc-hidden fields), for measurements
# only: a timed build runs without it.
fork-probe = ["salsa/fork-probe"]

[dependencies]
salsa = { workspace = true, features = ["fork"] }
thiserror.workspace = true
# The Engine is bound to rust-analyzer's database (D11, stage 2): a fork is a `RootDatabase`
# handle with a layer, and a file text is written into the layer's `FileText` input.
ra_ap_base_db.workspace = true
ra_ap_ide_db.workspace = true
# rust-analyzer keeps file texts as `triomphe::Arc<str>`.
triomphe.workspace = true

[dev-dependencies]
# The test databases use salsa's macros; both features are among those rust-analyzer enables.
salsa = { workspace = true, features = ["fork", "macros", "inventory"] }
trybuild = "1.0.116"
# The differential gate (V2) loads sessions and runs the flat reference check through the adapter.
ryo-v2-ra.workspace = true
ryo-v2-core.workspace = true
ra_ap_ide.workspace = true
ra_ap_hir_ty.workspace = true
