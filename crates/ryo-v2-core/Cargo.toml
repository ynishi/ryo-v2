[package]
name = "ryo-v2-core"
description = "Core (SDK) of ryo-v2: Speculative refactoring engine for Rust: Blueprints explored and verified in-process on rust-analyzer, built once after commit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[dependencies]
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
arch-lint.workspace = true
# Crate-local on purpose; move to [workspace.dependencies] when a second crate needs syn.
syn = { version = "2", features = ["full", "visit"] }
