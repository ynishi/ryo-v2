[package]
name = "ryo-v2-host"
description = "Host of ryo-v2: the `ryo-v2` binary, which runs the engine behind a front such as the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ryo-v2-host"
readme.workspace = true
keywords = ["refactoring", "rust-analyzer", "cli", "codemod"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[[bin]]
name = "ryo-v2"
path = "src/main.rs"

[dependencies]
ryo-v2-core.workspace = true
ryo-v2-ra.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7", "std"] }
