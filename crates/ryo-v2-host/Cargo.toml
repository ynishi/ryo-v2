[package]
name = "ryo-v2-host"
description = "Host of ryo-v2: the `ryo-v2` binary, which runs the engine behind a front such as the command line, and the `engine-probe` measurement binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# D11: nothing that depends on the patched salsa (the fork Engine, through `ryo-v2-ra`) is
# published in this phase.
publish = false
keywords = ["refactoring", "rust-analyzer", "cli", "codemod"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[features]
# The fork Engine's walk counters (salsa's `fork-probe`): `bench --depth-sweep` and `engine-probe
# --depth` then also print them. For measurements of counts only; a timed run is built without it.
fork-probe = ["ryo-v2-ra/fork-probe"]

[[bin]]
name = "ryo-v2"
path = "src/main.rs"

[dependencies]
ryo-v2-core.workspace = true
ryo-v2-ra.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7", "std"] }
