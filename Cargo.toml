[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/ryo-v2"
homepage = "https://github.com/ynishi/ryo-v2"
documentation = "https://docs.rs/ryo-v2"
readme = "README.md"

[workspace.dependencies]
ryo-v2-core = { path = "crates/ryo-v2-core", version = "0.1.0" }
ryo-v2-ra = { path = "crates/ryo-v2-ra", version = "0.1.0" }
arch-lint = "0.11"

# rust-analyzer as a library. Pinned exactly: the ra_ap_* crates promise no API
# stability (rust-analyzer issue #11615). Only `ryo-v2-ra` depends on them; the
# entry points are `ra_ap_ide` and `ra_ap_hir` (the crates architecture.md calls
# API boundaries). Bumped as one change, with the oracle counts re-measured.
ra_ap_ide = "=0.0.358"
ra_ap_hir = "=0.0.358"
ra_ap_base_db = "=0.0.358"
ra_ap_vfs = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_project_model = "=0.0.358"
triomphe = "0.1"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }

# The ra_ap_* stack is slow unoptimized even for tests; dependencies get opt-level 2.
[profile.dev.package."*"]
opt-level = 2
